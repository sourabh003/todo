<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Todo app</title>
		<script src="./scripts/db.js" type="text/javascript" defer></script>
		<script src="./scripts/index.js" type="text/javascript" defer></script>
		<link rel="stylesheet" href="./styles/index.css" />
		<link rel="icon" type="image/png" href="./images/favicon.png" />
	</head>
	<body>
		<header>
			<h1>Todo App</h1>
		</header>

		<main>
			<section class="form-sec">
				<form id="todo-form" action="">
					<h3>Add todo</h3>
					<textarea id="todo-input"></textarea>
					<button>Add</button>
				</form>
			</section>
			<section class="list-sec">
				<div class="sections">
					<div class="sec-header">
						<div>Pending</div>
						<div id="pending-count">0</div>
					</div>

					<div class="sec-list" id="sec-pending"></div>
				</div>
				<div class="sections">
					<div class="sec-header">
						<div>Completed</div>
						<div id="completed-count">0</div>
					</div>

					<div class="sec-list" id="sec-completed"></div>
				</div>
			</section>
		</main>
	</body>
</html>
